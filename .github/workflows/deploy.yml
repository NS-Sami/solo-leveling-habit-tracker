# Runs the tests and a production build on every push to main.
#
# Hosting is done by Cloudflare (see docs/HOSTING.md), which builds from GitHub by itself.
# To publish to GitHub Pages instead, add a repository variable
#   Settings > Secrets and variables > Actions > Variables:  DEPLOY_TO_GITHUB_PAGES = true
# and set Settings > Pages > Source to "GitHub Actions".
name: Test and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      # Also refuses to build if a Supabase secret key is in a published file.
      - run: npm run build
      - if: vars.DEPLOY_TO_GITHUB_PAGES == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-github-pages:
    if: vars.DEPLOY_TO_GITHUB_PAGES == 'true' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
